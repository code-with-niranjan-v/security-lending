spring.application.name=market-data-service
server.port=8080
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/market_data
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
logging.file.name=logs/app.log
logging.level.root=INFO
logging.level.com.example.splitease=DEBUG
market-data.poll-interval-ms=60000

# Local demo: share the PostgreSQL connection budget across all service processes.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.pool-name=${spring.application.name}-${server.port:8080}
spring.datasource.hikari.data-source-properties.ApplicationName=${spring.application.name}:${server.port:8080}

# Yahoo Finance circuit breaker. This does not add or alter retry behaviour.
resilience4j.circuitbreaker.instances.yahooFinance.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.yahooFinance.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.yahooFinance.slidingWindowSize=10
resilience4j.circuitbreaker.instances.yahooFinance.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.yahooFinance.failureRateThreshold=50
resilience4j.circuitbreaker.instances.yahooFinance.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.yahooFinance.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.yahooFinance.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.yahooFinance.ignoreExceptions=org.springframework.web.client.HttpClientErrorException
management.endpoint.health.show-details=when_authorized
management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=health,info,metrics

# Set market-data.redis.enabled=true to activate the redis profile and load the local YAML.
market-data.redis.enabled=true
market-data.redis.profile.true=redis
spring.profiles.include=${market-data.redis.profile.${market-data.redis.enabled}:}
management.health.redis.enabled=${market-data.redis.enabled}
