spring.application.name=api-gateway
server.port=8090
spring.cloud.compatibility-verifier.enabled=true
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info,metrics
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=false
eureka.client.registry-fetch-interval-seconds=5
spring.cloud.loadbalancer.retry.enabled=false
spring.cloud.loadbalancer.cache.enabled=false
spring.cloud.loadbalancer.configurations=health-check
spring.cloud.loadbalancer.health-check.initial-delay=0s
spring.cloud.loadbalancer.health-check.interval=5s
spring.cloud.loadbalancer.health-check.refetch-instances=true
spring.cloud.loadbalancer.health-check.refetch-instances-interval=5s
spring.cloud.loadbalancer.health-check.path.default=/actuator/health/readiness
spring.cloud.gateway.server.webflux.discovery.locator.enabled=false
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=3000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=60s
spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:5173,http://localhost:5175,http://localhost:5176
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.server.webflux.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
spring.cloud.gateway.server.webflux.routes[0].id=borrower
spring.cloud.gateway.server.webflux.routes[0].uri=lb://borrower-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/borrower/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webflux.routes[1].id=lender
spring.cloud.gateway.server.webflux.routes[1].uri=lb://lender-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/lender/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webflux.routes[2].id=accounts
spring.cloud.gateway.server.webflux.routes[2].uri=lb://lendora-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/accounts/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webflux.routes[3].id=market
spring.cloud.gateway.server.webflux.routes[3].uri=lb://market-data-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/market/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=StripPrefix=1
