server:
  http_listen_address: 127.0.0.1
  http_listen_port: 3200
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 127.0.0.1:4317
storage:
  trace:
    backend: local
    wal:
      path: ./observability/runtime/tempo/wal
    local:
      path: ./observability/runtime/tempo/blocks
compactor:
  compaction:
    block_retention: 48h
