name: lending-observability
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus

  tempo:
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo.yaml"]
    ports: ["127.0.0.1:3200:3200"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo:/var/tempo

  collector:
    image: otel/opentelemetry-collector-contrib:0.137.0
    command: ["--config=/etc/otelcol.yaml"]
    ports: ["127.0.0.1:4318:4318"]
    volumes:
      - ./collector.yaml:/etc/otelcol.yaml:ro
    environment:
      NO_PROXY: tempo,localhost,127.0.0.1
      no_proxy: tempo,localhost,127.0.0.1
    depends_on: [tempo]

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    # Kafka advertises localhost:9092 to clients, including the exporter.
    network_mode: host
    restart: unless-stopped
    command: ["--kafka.server=127.0.0.1:9092", "--web.listen-address=:9308"]
    profiles: [kafka]

volumes:
  prometheus:
  tempo:
