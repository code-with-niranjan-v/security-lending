receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  transform/privacy:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - delete_key(attributes, "url.query")
          - delete_key(attributes, "url.full")
          - delete_key(attributes, "http.target")
          - delete_key(attributes, "db.statement")
          - delete_key(attributes, "db.query.text")
      - context: spanevent
        statements:
          - delete_key(attributes, "exception.message")
          - delete_key(attributes, "exception.stacktrace")
  batch:
exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform/privacy, batch]
      exporters: [otlp/tempo]
