global:
  scrape_interval: 15s
scrape_configs:
  - job_name: lending-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [host.docker.internal:8080]
        labels: {service: market-data-service}
      - targets: [host.docker.internal:8081]
        labels: {service: borrower-service}
      - targets: [host.docker.internal:8082]
        labels: {service: borrower-fix-adapter}
      - targets: [host.docker.internal:8083]
        labels: {service: lender-fix-adapter}
      - targets: [host.docker.internal:8084]
        labels: {service: lender-service}
      - targets: [host.docker.internal:8085]
        labels: {service: lifecycle-service}
      - targets: [host.docker.internal:8086]
        labels: {service: lendora-service}
  - job_name: kafka
    static_configs:
      - targets: [host.docker.internal:9308]
