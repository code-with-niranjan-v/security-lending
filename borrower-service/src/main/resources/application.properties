spring.application.name=borrower-service
server.port=8081
spring.datasource.url=jdbc:postgresql://localhost:5432/borrower_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.group-id=borrower-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
borrower.market-data-url=http://localhost:8080
borrower.frontend-origin=http://localhost:5173
borrower.max-price-age-seconds=900
borrower.jobs-enabled=true
borrower.kafka-enabled=true
borrower.events-topic=borrower.events.v1
borrower.market-events-topic=market.prices.v1
management.endpoints.web.exposure.include=health,info
borrower.confirmations-topic=borrower.confirmations.v1
borrower.commands-topic=borrower.commands.v1

# Exhausted delivery attempts become FAILED; recovery works even while Kafka is down.
borrower.outbox-max-attempts=20
recovery.enabled=true
recovery.poll-ms=10000
recovery.borrower-adapter-url=http://localhost:8082
recovery.lender-adapter-url=http://localhost:8083

# HTTP reconciliation remains available during a Kafka outage.
recovery.lender-service-url=http://localhost:8084
# Must match the borrower FIX institution ID and the lender connection external ID.
recovery.borrower-counterparty-id=BORROWER_DEMO

# Lendora custom session authentication (no Spring Security).
lendora.auth-enabled=${LENDORA_AUTH_ENABLED:true}
lendora.auth-url=${LENDORA_AUTH_URL:http://localhost:8086}
lendora.provisioning-key=${LENDORA_PROVISIONING_KEY:}
lendora.allowed-origins=${LENDORA_ALLOWED_ORIGINS:http://localhost:5176,http://localhost:5175,http://localhost:5174,http://localhost:5173}

# Local demo: share the PostgreSQL connection budget across all service processes.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.pool-name=${spring.application.name}-${server.port:8080}
spring.datasource.hikari.data-source-properties.ApplicationName=${spring.application.name}:${server.port:8080}

# Standalone remains the default. The discovery profile enables registration and coordination.
eureka.client.enabled=false
spring.cloud.discovery.enabled=false
spring.cloud.compatibility-verifier.enabled=true
spring.cloud.loadbalancer.retry.enabled=false
