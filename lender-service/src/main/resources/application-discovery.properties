eureka.client.enabled=true
spring.cloud.discovery.enabled=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.hostname=localhost
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
eureka.client.registry-fetch-interval-seconds=5
eureka.client.instance-info-replication-interval-seconds=5
eureka.client.initial-instance-info-replication-interval-seconds=5
eureka.instance.health-check-url-path=/actuator/health/readiness
eureka.client.healthcheck.enabled=true
spring.cloud.loadbalancer.cache.enabled=false
spring.cloud.loadbalancer.health-check.initial-delay=0s
spring.cloud.loadbalancer.health-check.interval=5s
spring.cloud.loadbalancer.health-check.refetch-instances=true
spring.cloud.loadbalancer.health-check.refetch-instances-interval=5s
spring.cloud.loadbalancer.health-check.path.default=/actuator/health/readiness
spring.cloud.loadbalancer.configurations=health-check
spring.kafka.listener.concurrency=1
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
platform.coordination.enabled=true
# A database previously used by main may already have V23 or V24 before discovery's V22.
spring.flyway.out-of-order=true
lender.market-data-url=http://market-data-service
recovery.borrower-adapter-url=http://borrower-fix-adapter
recovery.lender-adapter-url=http://lender-fix-adapter
lendora.auth-url=http://lendora-service
lender.lifecycle-url=http://lifecycle-service
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=2
