spring.application.name=lender-service
server.port=8084
spring.datasource.url=jdbc:postgresql://localhost:5432/lender_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.delivery.timeout.ms=15000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=record
spring.task.scheduling.pool.size=2
lender.kafka-enabled=true
lender.jobs-enabled=true
lender.commands-topic=lender.commands.v1
lender.lifecycle-events-topic=lender.lifecycle.events.v1
lender.market-data-url=http://localhost:8080
lender.frontend-origin=http://localhost:5174
lender.max-price-age-seconds=900
management.endpoints.web.exposure.include=health,info

# Exhausted delivery attempts become FAILED; recovery works even while Kafka is down.
lender.outbox-max-attempts=20
recovery.enabled=true
recovery.poll-ms=10000
recovery.borrower-adapter-url=http://localhost:8082
recovery.lender-adapter-url=http://localhost:8083

# Lendora custom session authentication (no Spring Security).
lendora.auth-enabled=${LENDORA_AUTH_ENABLED:true}
lendora.auth-url=${LENDORA_AUTH_URL:http://localhost:8086}
lendora.provisioning-key=${LENDORA_PROVISIONING_KEY:}
lendora.allowed-origins=${LENDORA_ALLOWED_ORIGINS:http://localhost:5176,http://localhost:5175,http://localhost:5174,http://localhost:5173}

# Local demo: share the PostgreSQL connection budget across all service processes.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.pool-name=${spring.application.name}-${server.port:8080}
spring.datasource.hikari.data-source-properties.ApplicationName=${spring.application.name}:${server.port:8080}

# Registered borrowers share this borrower-service/FIX-adapter institution identity.
lendora.borrower-institution-id=${LENDORA_BORROWER_INSTITUTION_ID:BORROWER_DEMO}

# Internal demo buy-in matcher. Never fills against stale quotes.
lender.buyin-order-poll-ms=${BUYIN_ORDER_POLL_MS:5000}

# Internal lifecycle control plane for tenant-scoped manual default scans.
lender.lifecycle-url=${LIFECYCLE_SERVICE_URL:http://localhost:8085}

# Standalone remains the default. The discovery profile enables registration and coordination.
eureka.client.enabled=false
spring.cloud.discovery.enabled=false
spring.cloud.compatibility-verifier.enabled=true
spring.cloud.loadbalancer.retry.enabled=false
